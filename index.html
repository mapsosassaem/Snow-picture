<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>눈 내리는 내 그림</title>
<style>
  :root{--sky:#1b2a6b;--card:#ffffff;--pink:#ff6f91;--yellow:#ffd23f;--mint:#4cc9b0;--ink:#2b2b3a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:radial-gradient(circle at 50% 0%,#3446a8 0%,var(--sky) 60%,#111a45 100%);color:var(--ink);
    min-height:100%;display:flex;flex-direction:column;align-items:center;padding:16px 12px 28px;user-select:none;-webkit-user-select:none}
  h1{color:#fff;font-size:clamp(26px,5vw,40px);margin:4px 0 14px;letter-spacing:-1px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
  h1 span{color:var(--yellow)}
  #stage{flex:none;position:relative;width:min(100%,1000px);background:#0d1640;border-radius:22px;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35);border:5px solid #fff;display:flex;align-items:center;justify-content:center;min-height:240px}
  canvas{display:block;flex:none}
  #empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;font-size:22px;text-align:center;cursor:pointer}
  #empty .big{font-size:64px}
  .controls{flex:none;width:min(100%,1000px);display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
  .group{background:var(--card);border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
  .group b{font-size:18px;margin-right:4px;white-space:nowrap}
  button{font:inherit;font-size:19px;font-weight:700;border:none;border-radius:14px;padding:12px 16px;cursor:pointer;
    background:#eef0fb;color:var(--ink);transition:transform .08s}
  button:active{transform:scale(.94)}
  button.on{background:var(--yellow)}
  .main{font-size:22px;padding:16px 26px;border-radius:18px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}
  #pick{background:var(--mint)}
  #save{background:var(--pink)}
  button:disabled{opacity:.45;cursor:default}
  #msg{color:#fff;font-size:20px;min-height:30px;margin-top:14px;text-align:center}
  #rec{position:absolute;top:12px;left:12px;background:rgba(255,60,90,.92);color:#fff;font-weight:800;font-size:18px;padding:8px 14px;border-radius:999px;display:none}
  input[type=file]{display:none}
</style>
</head>
<body>
<h1>❄️ 눈 내리는 <span>내 그림</span></h1>

<div id="stage">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="empty"><div class="big">🖼️</div><div>여기를 눌러<br>내 그림을 넣어 보세요</div></div>
  <div id="rec">● 영상 만드는 중</div>
</div>

<div class="controls">
  <button id="pick" class="main">🖼️ 그림 넣기</button>
  <div class="group"><b>눈 양</b>
    <button data-k="amount" data-v="0.5">조금</button>
    <button data-k="amount" data-v="1" class="on">보통</button>
    <button data-k="amount" data-v="1.8">펑펑</button>
  </div>
  <div class="group"><b>속도</b>
    <button data-k="speed" data-v="0.6">천천히</button>
    <button data-k="speed" data-v="1" class="on">보통</button>
    <button data-k="speed" data-v="1.6">빠르게</button>
  </div>
  <div class="group"><b>눈 모양</b>
    <button data-k="style" data-v="soft" class="on">동글동글</button>
    <button data-k="style" data-v="crayon">포슬포슬</button>
  </div>
  <div class="group"><b>내 눈송이</b>
    <button data-k="mine" data-v="0" class="on">그대로</button>
    <button data-k="mine" data-v="1">같이 내리기</button>
  </div>
  <button id="save" class="main" disabled>💾 영상으로 저장</button>
</div>
<div id="msg"></div>
<input id="file" type="file" accept="image/*">

<script>
(function(){
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var fileIn=document.getElementById('file'), msg=document.getElementById('msg');
  var saveBtn=document.getElementById('save'), recTag=document.getElementById('rec');
  var img=null, recording=false;
  var opt={amount:1, speed:1, style:'soft', mine:0};
  var found=null; // 그림 속 눈송이 인식 결과 (그림마다 한 번만 계산)
  var LOOP=6;          // 6초마다 똑같이 반복 (영상도 끊김 없이 이어짐)
  var FPS=15;          // 손그림 느낌을 위해 일부러 낮춤
  var MAXSIDE=1280;

  // ---------- 눈송이 그림(스프라이트) ----------
  var spriteCache={};
  function sprite(r, style, alpha){
    var key=style+'|'+r.toFixed(1)+'|'+alpha;
    if(spriteCache[key]) return spriteCache[key];
    var s=Math.ceil(r*2.6)+4, c=document.createElement('canvas'); c.width=c.height=s;
    var g=c.getContext('2d'), m=s/2;
    if(style==='soft'){
      var gr=g.createRadialGradient(m,m,0,m,m,r*1.3);
      gr.addColorStop(0,'rgba(255,255,255,'+alpha+')');
      gr.addColorStop(0.55,'rgba(255,255,255,'+alpha*0.9+')');
      gr.addColorStop(1,'rgba(255,255,255,0)');
      g.fillStyle=gr; g.beginPath(); g.arc(m,m,r*1.3,0,Math.PI*2); g.fill();
    }else{ // 크레용처럼 포슬포슬한 점들
      var n=Math.floor(r*r*2.2)+12;
      for(var i=0;i<n;i++){
        var a=Math.random()*Math.PI*2, d=Math.pow(Math.random(),0.6)*r*1.15;
        var pr=Math.max(0.7,r*0.12*(0.6+Math.random()));
        g.fillStyle='rgba(255,255,255,'+(alpha*(0.55+Math.random()*0.45))+')';
        g.beginPath(); g.arc(m+Math.cos(a)*d,m+Math.sin(a)*d,pr,0,Math.PI*2); g.fill();
      }
      g.fillStyle='rgba(255,255,255,'+alpha*0.5+')';
      g.beginPath(); g.arc(m,m,r*0.55,0,Math.PI*2); g.fill();
    }
    spriteCache[key]=c; return c;
  }

  // ---------- 눈송이 만들기 ----------
  // k = 한 번 반복(LOOP) 동안 화면을 몇 번 지나가는지 (정수여야 끊김 없이 반복)
  var flakes=[];
  function seedRand(seed){return function(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646}}
  function buildFlakes(){
    flakes=[]; spriteCache={};
    var W=cv.width, H=cv.height, sc=Math.max(W,H)/1280, rnd=seedRand(12345);
    var layers=[ // 개수, 반지름 범위, 기본 속도, 투명도
      [70,[2.6,4],1,0.75],
      [40,[4.5,6.5],2,0.9],
      [12,[7,9.5],2,0.95]
    ];
    layers.forEach(function(L){
      var n=Math.round(L[0]*opt.amount*(W*H)/(1280*720)+L[0]*opt.amount*0.25);
      for(var i=0;i<n;i++){
        var r=(L[1][0]+rnd()*(L[1][1]-L[1][0]))*sc;
        flakes.push({spr:sprite(r,opt.style,L[3]), x:rnd()*W, y:rnd(), base:L[2],
          amp:(5+rnd()*9)*sc, ph:rnd()*Math.PI*2});
      }
    });
  }
  function loops(f){ // 속도 옵션을 반영하되 정수 유지
    return f.base;
  }


  // ---------- 그림 속 눈송이 자동 인식 ----------
  function boxPass(src,W,H,r,isMax,horiz){ // 1차원 최대/최소 필터
    var out=new Uint8Array(W*H);
    for(var a=0;a<(horiz?H:W);a++){
      for(var b=0;b<(horiz?W:H);b++){
        var v=isMax?0:1;
        for(var o=-r;o<=r;o++){
          var bb=b+o; if(bb<0||bb>=(horiz?W:H)) { if(!isMax){v=v;} continue; }
          var x=horiz?bb:a, y=horiz?a:bb, q=src[y*W+x];
          if(isMax){ if(q){v=1;break} } else { if(!q){v=0;break} }
        }
        out[horiz?(a*W+b):(b*W+a)]=v;
      }
    }
    return out;
  }
  function dilate(m,W,H,r){return boxPass(boxPass(m,W,H,r,true,true),W,H,r,true,false)}
  function erode(m,W,H,r){return boxPass(boxPass(m,W,H,r,false,true),W,H,r,false,false)}

  function detectMine(){
    var W=cv.width,H=cv.height,N=W*H,M=Math.max(W,H),sc=M/1672;
    var oc=document.createElement('canvas'); oc.width=W; oc.height=H;
    var g=oc.getContext('2d'); g.drawImage(img,0,0,W,H);
    var id=g.getImageData(0,0,W,H), d=id.data, orig=new Uint8ClampedArray(d);
    var white=new Uint8Array(N), sky=new Uint8Array(N);
    for(var i=0;i<N;i++){
      var r=d[i*4],gg=d[i*4+1],b=d[i*4+2],mx=Math.max(r,gg,b),mn=Math.min(r,gg,b);
      var sat=mx?(mx-mn)*255/mx:0;
      white[i]=(sat<70&&mx>170)?1:0;
      sky[i]=(b>r+40&&b>gg+20&&mx<200)?1:0;
    }
    var wm=erode(dilate(white,W,H,2),W,H,2);
    // 덩어리 찾기
    var lab=new Int32Array(N), stack=new Int32Array(N), comps=[], n=0;
    for(var i=0;i<N;i++){
      if(!wm[i]||lab[i]) continue;
      n++; var sp=0; stack[sp++]=i; lab[i]=n;
      var c={id:n,minx:W,miny:H,maxx:0,maxy:0,area:0,sr:0,sb:0};
      while(sp){
        var p=stack[--sp], x=p%W, y=(p-x)/W;
        c.area++; c.sr+=orig[p*4]; c.sb+=orig[p*4+2];
        if(x<c.minx)c.minx=x; if(x>c.maxx)c.maxx=x; if(y<c.miny)c.miny=y; if(y>c.maxy)c.maxy=y;
        if(c.area>N*0.002){} // 너무 큰 덩어리도 끝까지 채움(라벨 중복 방지)
        if(x>0&&wm[p-1]&&!lab[p-1]){lab[p-1]=n;stack[sp++]=p-1}
        if(x<W-1&&wm[p+1]&&!lab[p+1]){lab[p+1]=n;stack[sp++]=p+1}
        if(y>0&&wm[p-W]&&!lab[p-W]){lab[p-W]=n;stack[sp++]=p-W}
        if(y<H-1&&wm[p+W]&&!lab[p+W]){lab[p+W]=n;stack[sp++]=p+W}
      }
      comps.push(c);
    }
    var aMin=1.5e-5*M*M, aMax=1.2e-3*M*M, sMax=0.05*M, pad=Math.round(10*sc)+2;
    var keep={}, list=[];
    comps.forEach(function(c){
      var w=c.maxx-c.minx+1, h=c.maxy-c.miny+1;
      if(c.area<aMin||c.area>aMax||w>sMax||h>sMax||w/h<0.6||w/h>1.6) return;
      if(c.sb/c.area < c.sr/c.area-5) return; // 노란 창문 등 제외
      var x0=Math.max(0,c.minx-pad),y0=Math.max(0,c.miny-pad),x1=Math.min(W-1,c.maxx+pad),y1=Math.min(H-1,c.maxy+pad);
      var tot=0,sk=0,side=[[0,0],[0,0],[0,0],[0,0]]; // 위, 아래, 왼쪽, 오른쪽
      for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){
        if(x>=c.minx&&x<=c.maxx&&y>=c.miny&&y<=c.maxy) continue;
        var v=sky[y*W+x]; tot++; sk+=v;
        var sd= y<c.miny?0 : y>c.maxy?1 : x<c.minx?2 : 3;
        side[sd][0]++; side[sd][1]+=v;
      }
      if(!tot||sk/tot<0.93) return; // 주변이 밤하늘일 때만
      for(var q=0;q<4;q++){ if(side[q][0]&&side[q][1]/side[q][0]<0.85) return; } // 사방이 모두 하늘이어야 함
      keep[c.id]=1; list.push(c);
    });
    if(!list.length) return {count:0};
    var fm0=new Uint8Array(N);
    for(var i=0;i<N;i++) if(keep[lab[i]]) fm0[i]=1;
    var fm=dilate(fm0,W,H,Math.round(7*sc)+1);
    // 빈자리 메우기: 가까운 깨끗한 하늘 조각을 복사
    list.forEach(function(c){
      var p2=pad, x0=c.minx-p2,y0=c.miny-p2,ww=c.maxx-c.minx+1+2*p2,hh=c.maxy-c.miny+1+2*p2;
      var offs=[]; [60,90,120,150].forEach(function(dd){[-1,1].forEach(function(sg){[0,-40,40].forEach(function(dy){offs.push([Math.round(dd*sg*sc),Math.round(dy*sc)])})})});
      var src=null;
      for(var k=0;k<offs.length&&!src;k++){
        var sx=x0+offs[k][0], sy=y0+offs[k][1], ok=true;
        if(sx<0||sy<0||sx+ww>W||sy+hh>H) continue;
        for(var y=0;y<hh&&ok;y++)for(var x=0;x<ww;x++){var q=(sy+y)*W+sx+x; if(fm[q]||!sky[q]){ok=false;break}}
        if(ok) src=[sx,sy];
      }
      // 주변(링) 평균색
      var rm=[0,0,0],rn=0,sm=[0,0,0];
      for(var y=0;y<hh;y++)for(var x=0;x<ww;x++){
        var X=x0+x,Y=y0+y; if(X<0||Y<0||X>=W||Y>=H) continue; var q=Y*W+X; if(fm[q]) continue;
        rn++; for(var ch=0;ch<3;ch++){rm[ch]+=orig[q*4+ch]; if(src) sm[ch]+=orig[((src[1]+y)*W+src[0]+x)*4+ch]}
      }
      if(rn){for(var ch=0;ch<3;ch++){rm[ch]/=rn; sm[ch]/=rn}}
      for(var y=0;y<hh;y++)for(var x=0;x<ww;x++){
        var X=x0+x,Y=y0+y; if(X<0||Y<0||X>=W||Y>=H) continue; var q=Y*W+X;
        // 가장자리를 부드럽게: 주변 3px 안의 마스크 비율
        var wsum=0,wc=0;
        for(var oy=-3;oy<=3;oy+=3)for(var ox=-3;ox<=3;ox+=3){var XX=X+ox,YY=Y+oy; if(XX<0||YY<0||XX>=W||YY>=H) continue; wc++; wsum+=fm[YY*W+XX]}
        var m=wc?wsum/wc:0; if(!m) continue;
        for(var ch=0;ch<3;ch++){
          var v = src ? orig[((src[1]+y)*W+src[0]+x)*4+ch]+(rm[ch]-sm[ch]) : rm[ch]+(Math.random()-0.5)*12;
          d[q*4+ch]=d[q*4+ch]*(1-m)+v*m;
        }
      }
    });
    g.putImageData(id,0,0);
    // 눈송이 조각 오려내기
    var sprites=[];
    list.forEach(function(c){
      var p3=Math.round(8*sc)+1, x0=Math.max(0,c.minx-p3),y0=Math.max(0,c.miny-p3),x1=Math.min(W-1,c.maxx+p3),y1=Math.min(H-1,c.maxy+p3);
      var w=x1-x0+1,h=y1-y0+1, sc2=document.createElement('canvas'); sc2.width=w; sc2.height=h;
      var sg=sc2.getContext('2d'), sd=sg.createImageData(w,h);
      // 이 눈송이에서 가장 밝은 부분(상위 10%)을 '완전한 눈' 기준으로
      var vals=[];
      for(var y=y0;y<=y1;y++)for(var x=x0;x<=x1;x++){var q=y*W+x; if(fm0[q]){var o=q*4; vals.push(Math.max(orig[o],orig[o+1],orig[o+2]))}}
      vals.sort(function(a,b){return a-b});
      var peak=vals.length?vals[Math.floor(vals.length*0.9)]:240;
      var A=new Float32Array(w*h), core=[0,0,0], cn=0;
      for(var y=0;y<h;y++)for(var x=0;x<w;x++){
        var q=(y0+y)*W+x0+x, o=q*4; if(!fm[q]) continue;
        var vo=Math.max(orig[o],orig[o+1],orig[o+2]), vb=Math.max(d[o],d[o+1],d[o+2]);
        var a=Math.pow(Math.min(1,Math.max(0,(vo-vb)/Math.max(peak-vb,1)*1.7)),0.8);
        A[y*w+x]=a;
        if(a>0.85){core[0]+=orig[o];core[1]+=orig[o+1];core[2]+=orig[o+2];cn++}
      }
      if(cn){core[0]/=cn;core[1]/=cn;core[2]/=cn} else core=[250,250,252];
      for(var y=0;y<h;y++)for(var x=0;x<w;x++){
        var a=A[y*w+x]; if(a<0.03) continue;
        var q=(y0+y)*W+x0+x, o=q*4, t=(y*w+x)*4;
        var vo=Math.max(orig[o],orig[o+1],orig[o+2]), shade=0.88+0.12*Math.min(1,vo/peak); // 크레용 결은 살짝 남김
        for(var ch=0;ch<3;ch++){ var cc=core[ch]+(255-core[ch])*0.7; sd.data[t+ch]=Math.min(255,cc*shade+8); } // 흰색 쪽으로
        sd.data[t+3]=a*255;
      }
      sg.putImageData(sd,0,0);
      sprites.push({spr:sc2, cx:(x0+x1)/2, cy:(y0+y1)/2, w:w});
    });
    return {count:list.length, bg:oc, sprites:sprites};
  }
  function flipped(c){var o=document.createElement('canvas');o.width=c.width;o.height=c.height;var g=o.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return o}
  var mineFlakes=[];
  function buildMine(){
    mineFlakes=[];
    if(!found||!found.count) return;
    var W=cv.width,H=cv.height,sc=Math.max(W,H)/1672,pad=20*Math.max(W,H)/1280,span=H+pad*2,rnd=seedRand(777);
    found.sprites.forEach(function(s){
      mineFlakes.push({spr:s.spr, x:s.cx, y:(s.cy+pad)/span, amp:(6+rnd()*5)*sc, ph:rnd()*Math.PI*2});
    });
    // 그림 아래쪽(땅)처럼 눈송이가 없던 줄이 위로 올라올 때 하늘이 비지 않도록 채움
    var bins=8, cnt=new Array(bins).fill(0);
    mineFlakes.forEach(function(f){cnt[Math.min(bins-1,Math.floor(f.y*bins))]++});
    var ne=cnt.filter(function(c){return c>0}).length, avg=ne?mineFlakes.length/ne:0;
    var pool=found.sprites.slice().sort(function(a,b){return b.w-a.w}).slice(0,Math.max(1,Math.ceil(found.sprites.length/2)));
    for(var b=0;b<bins;b++){
      var need=Math.round(avg)-cnt[b];
      for(var j=0;j<need;j++){
        var s=pool[Math.floor(rnd()*pool.length)];
        mineFlakes.push({spr:flipped(s.spr), x:rnd()*W, y:(b+rnd())/bins, amp:(6+rnd()*5)*sc, ph:rnd()*Math.PI*2});
      }
    }
  }

  // ---------- 그리기 ----------
  function draw(t){ // t: 0~1 (반복 안에서의 위치)
    var W=cv.width, H=cv.height;
    var useMine=opt.mine&&found&&found.count;
    if(img) ctx.drawImage(useMine?found.bg:img,0,0,W,H); else {ctx.fillStyle='#0d1640';ctx.fillRect(0,0,W,H)}
    var pad=20*Math.max(W,H)/1280, span=H+pad*2;
    if(useMine){
      for(var j=0;j<mineFlakes.length;j++){
        var m=mineFlakes[j], ms=m.spr;
        var my=((m.y+t)%1)*span-pad, mx=m.x+m.amp*Math.sin(2*Math.PI*t+m.ph);
        ctx.drawImage(ms, Math.round(mx-ms.width/2), Math.round(my-ms.height/2));
      }
    }
    for(var i=0;i<flakes.length;i++){
      var f=flakes[i], s=f.spr;
      var y=((f.y+loops(f)*t)%1)*span-pad;
      var x=f.x+f.amp*Math.sin(2*Math.PI*t+f.ph);
      if(x<-s.width) x+=W; if(x>W+s.width) x-=W;
      ctx.drawImage(s, Math.round(x-s.width/2), Math.round(y-s.height/2));
    }
  }
  var start=performance.now(), last=0;
  function tick(now){
    requestAnimationFrame(tick);
    if(now-last < 1000/FPS - 2) return;
    last=now;
    draw(((now-start)/1000 % LOOP)/LOOP);
  }
  requestAnimationFrame(tick);

  // ---------- 화면에 맞게 그림 크기 맞추기 (세로 그림도 전체가 보이게) ----------
  var stage=document.getElementById('stage');
  function fitCanvas(){
    var maxW=stage.clientWidth;
    var vh=Math.min(window.innerHeight||9999,(window.screen&&screen.height)||9999);
    var maxH=Math.max(220,vh*0.6);
    var k=Math.min(maxW/cv.width,maxH/cv.height);
    cv.style.width=Math.floor(cv.width*k)+'px'; cv.style.height=Math.floor(cv.height*k)+'px';
  }
  window.addEventListener('resize',fitCanvas);
  window.addEventListener('orientationchange',function(){setTimeout(fitCanvas,300)});
  fitCanvas();
  // ---------- 그림 불러오기 ----------
  function openPicker(){ if(!recording) fileIn.click(); }
  document.getElementById('pick').onclick=openPicker;
  document.getElementById('empty').onclick=openPicker;
  fileIn.onchange=function(){
    var f=fileIn.files&&fileIn.files[0]; if(!f) return;
    var url=URL.createObjectURL(f), im=new Image();
    im.onload=function(){
      var w=im.naturalWidth, h=im.naturalHeight, k=Math.min(1,MAXSIDE/Math.max(w,h));
      cv.width=Math.round(w*k/2)*2; cv.height=Math.round(h*k/2)*2;
      img=im; found=null; mineFlakes=[]; fitCanvas(); buildFlakes();
      if(opt.mine){ found=detectMine(); buildMine(); }
      document.getElementById('empty').style.display='none';
      saveBtn.disabled=false;
      if(opt.mine) mineMsg(); else msg.textContent='눈이 내려요! ❄️ 마음에 들면 영상으로 저장해 보세요.';
      fileIn.value='';
    };
    im.onerror=function(){msg.textContent='이 파일은 열 수 없어요. 사진(그림) 파일을 골라 주세요.'};
    im.src=url;
  };

  function mineMsg(){
    if(found&&found.count) msg.textContent='그림 속 눈송이 '+found.count+'개를 찾았어요! 같이 내려요 ❄️';
    else msg.textContent='그림에서 눈송이를 찾지 못했어요. 새 눈만 내려요.';
  }
  // ---------- 옵션 버튼 ----------
  Array.prototype.forEach.call(document.querySelectorAll('[data-k]'),function(b){
    b.onclick=function(){
      if(recording) return;
      var k=b.dataset.k;
      Array.prototype.forEach.call(document.querySelectorAll('[data-k="'+k+'"]'),function(o){o.classList.remove('on')});
      b.classList.add('on');
      opt[k]= k==='style' ? b.dataset.v : parseFloat(b.dataset.v);
      if(k==='speed'){ LOOP=Math.round(6/opt.speed*10)/10; start=performance.now(); }
      if(k==='mine'){
        if(opt.mine&&img){
          if(!found){ msg.textContent='그림 속 눈송이를 찾는 중…';
            setTimeout(function(){ found=detectMine(); buildMine(); mineMsg(); },30); return; }
          mineMsg();
        } else if(img) msg.textContent='그림 속 눈송이는 그대로 두고, 새 눈만 내려요.';
        return;
      }
      buildFlakes();
    };
  });

  // ---------- 영상 저장 ----------
  function pickType(){
    var list=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
    if(!window.MediaRecorder) return null;
    for(var i=0;i<list.length;i++){ if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(list[i])) return list[i]; }
    return '';
  }
  function setBusy(on){
    recording=on; recTag.style.display=on?'block':'none';
    Array.prototype.forEach.call(document.querySelectorAll('button'),function(b){b.disabled=on||(b===saveBtn&&!img)});
  }
  saveBtn.onclick=function(){
    if(!img||recording) return;
    var type=pickType();
    if(type===null||!cv.captureStream){msg.textContent='이 브라우저는 영상 저장을 지원하지 않아요. 크롬이나 사파리 최신 버전에서 열어 주세요.';return}
    var stream=cv.captureStream(FPS), chunks=[], rec;
    try{ rec=type?new MediaRecorder(stream,{mimeType:type,videoBitsPerSecond:6000000}):new MediaRecorder(stream) }
    catch(e){ msg.textContent='영상 저장을 시작하지 못했어요. 다른 브라우저에서 해 보세요.'; return }
    rec.ondataavailable=function(e){ if(e.data&&e.data.size) chunks.push(e.data) };
    rec.onstop=function(){
      var mime=rec.mimeType||type||'video/webm', ext=mime.indexOf('mp4')>=0?'mp4':'webm';
      var blob=new Blob(chunks,{type:mime}), a=document.createElement('a');
      var d=new Date(), stamp=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+String(d.getSeconds()).padStart(2,'0');
      var name='눈내리는그림_'+stamp+'.'+ext;
      function plain(){
        a.href=URL.createObjectURL(blob); a.download=name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){URL.revokeObjectURL(a.href)},60000);
        setBusy(false); msg.textContent='저장했어요! 🎉 (다운로드 폴더를 확인해 보세요)';
      }
      var cl=window.claude;
      if(cl&&cl.use){ // Claude 링크에서 열었을 때는 플랫폼 저장 기능 사용
        cl.use('downloads').then(function(dl){
          if(!dl){ plain(); return }
          dl.save({filename:name,data:blob}).then(function(){
            setBusy(false); msg.textContent='저장했어요! 🎉';
          },function(e){
            setBusy(false);
            msg.textContent=(e&&e.code==='declined')?'저장을 취소했어요.':'저장하지 못했어요. 다시 눌러 보세요.';
          });
        },function(){ plain() });
      } else plain();
    };
    // 반복 시작점에 맞춰 녹화 → 영상도 끝과 처음이 자연스럽게 이어짐
    start=performance.now(); last=0;
    setBusy(true);
    var left=LOOP; msg.textContent='영상 만드는 중… '+left+'초만 기다려 주세요';
    var iv=setInterval(function(){left--; if(left>0) msg.textContent='영상 만드는 중… '+left+'초만 기다려 주세요'; else clearInterval(iv)},1000);
    rec.start(250);
    setTimeout(function(){ rec.stop(); stream.getTracks().forEach(function(t){t.stop()}) }, LOOP*1000+120);
  };
})();
</script>
</body>
</html>
